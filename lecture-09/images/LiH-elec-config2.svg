<svg width="340" height="320" viewBox="0 0 340 320" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Electron configuration of Li and H shown as orbital boxes with spin arrows</title>
<desc>Lithium: 1s orbital box with two electrons (up and down arrows), 2s orbital box with one electron (up arrow), 2p shown as three empty boxes. Hydrogen: 1s orbital box with one electron (up arrow).</desc>

<style>
text { font-family: Arial, Helvetica, sans-serif; fill: #1a1a1a; }
.h { font-size: 20px; font-weight: 600; }
.ts { font-size: 14px; }
</style>

<!-- Lithium -->
<text class="h" x="40" y="40">Lithium (Li)</text>
<text class="ts" x="40" y="60">1s&#178; 2s&#185; 2p&#8304;</text>

<!-- Li 1s box -->
<rect x="40" y="90" width="46" height="46" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text class="ts" x="63" y="152" text-anchor="middle">1s</text>
<line x1="53" y1="123" x2="53" y2="101" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="53,97 49,105 57,105" fill="#1a1a1a"/>
<line x1="73" y1="101" x2="73" y2="123" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="73,127 69,119 77,119" fill="#1a1a1a"/>

<!-- Li 2s box -->
<rect x="110" y="90" width="46" height="46" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text class="ts" x="133" y="152" text-anchor="middle">2s</text>
<line x1="133" y1="123" x2="133" y2="101" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="133,97 129,105 137,105" fill="#1a1a1a"/>

<!-- Li 2p boxes (empty) x3 -->
<rect x="180" y="90" width="46" height="46" fill="none" stroke="#888888" stroke-width="1.5"/>
<rect x="226" y="90" width="46" height="46" fill="none" stroke="#888888" stroke-width="1.5"/>
<rect x="272" y="90" width="46" height="46" fill="none" stroke="#888888" stroke-width="1.5"/>
<text class="ts" x="249" y="152" text-anchor="middle">2p (empty)</text>

<!-- Hydrogen -->
<text class="h" x="40" y="220">Hydrogen (H)</text>
<text class="ts" x="40" y="240">1s&#185;</text>

<rect x="40" y="255" width="46" height="46" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text class="ts" x="63" y="317" text-anchor="middle">1s</text>
<line x1="63" y1="288" x2="63" y2="266" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="63,262 59,270 67,270" fill="#1a1a1a"/>

</svg>
